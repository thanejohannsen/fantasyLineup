# ZOO + PEARL — Sleeper fantasy lineup advisor
[league]
league_id = "1389691132912361472"
roster_id = 5                                    # ThaneosTV / "Patrick Likes It Rough"
season = 2026
# 2025 season, status=complete — used as the backtest / prior-fitting corpus
previous_league_id = "1257120142102372352"

[paths]
db = "data/fantasylineup.db"
cache = "data/cache"
reports = "reports"
site = "docs"

[sources]
sleeper_base = "https://api.sleeper.app"
kalshi_base = "https://api.elections.kalshi.com/trade-api/v2"
# Sleeper asks for <1000 calls/min; we stay far below and cache aggressively.
max_calls_per_min = 120
# The 14.6MB player dump only needs refreshing daily.
players_dump_ttl_hours = 24
# Injury status can change hourly on game days.
status_ttl_minutes = 30

[model]
# Kalshi shifts the Sleeper baseline within this band; it never replaces it.
kalshi_max_shift = 0.25
# Monte Carlo draws for win-probability evaluation.
sim_draws = 20000

[trades]
# A marginal-lineup-value gain is a difference of two optimisations, and small
# projection movements can flip a slot assignment and jump the result. One live
# proposal read +23.9, +8.3 and -7.8 across successive refreshes of the same
# sources. These settings test a gain against ordinary drift before it is shown.
jitter = 0.03          # plausible relative error on a rest-of-season projection
draws = 200            # perturbations per proposal
require_stable = true  # drop offers whose 10th percentile gain is negative
# Games of current-season evidence before a trade may lean on a player carrying
# an injury designation. Applies to players we would be *relying* on, never to
# one we are sending: selling an injured player is best done before the market
# prices the injury, so gating that direction would cost the sell-high window.
min_games_for_contingency = 3

[health]
# Rest-of-season multipliers by injury regime.
#
# These are literature-informed judgment, not fitted values. Achilles ruptures
# return at a mean of 10.9 months and ACL reconstructions at 13.6, both beyond
# any remaining schedule, which is why out_long is zero rather than discounted.
# playing_diminished_structural is the weakest number here: decline in the first
# season back is documented, but Sleeper may already price some of it, so it is
# deliberately small. It is the first thing `fl calibrate` should measure.
healthy = 1.00
playing_diminished_structural = 0.90
playing_diminished_soft = 1.00
out_short = 0.40
out_long = 0.00

# Chance a player carrying each designation actually plays this week. Sleeper's
# app zeroes these players; its projections endpoint does not, so without this a
# player ruled out keeps his full weekly number and can be recommended as a
# starter. Sampled live: Brock Bowers 16.0 while Doubtful after meniscus
# surgery, Sam Darnold 17.1 while Out.
#
# out is definitional rather than judged -- he is not playing. doubtful follows
# the NFL's own "unlikely to play". questionable is the weakest number here and
# the first to calibrate: most questionable players do suit up, so too harsh a
# figure benches stars for knocks they play through.
weekly_out = 0.00
weekly_doubtful = 0.10
weekly_questionable = 0.80

# Known return weeks, entered by hand from news. No feed carries one: Sleeper
# gives a status and a body part but no date, and its per-week injury_override
# metadata is a record of weeks already missed, not a forecast.
#
# The value is the first week he plays. Setting it replaces the regime guess
# with arithmetic -- the share of the remaining schedule he is available for --
# which is why it is worth a minute of typing when news breaks.
#
# One caveat: Sleeper's season figure may already reflect part of the absence.
# Josh Jacobs was carrying 87.2 while suspended, well under a starting back, so
# prorating on top can double-count. It is still far better than the zero the
# model gave him before it could express "back in week 7".
[health.returns]
# "Josh Jacobs" = 7   # six-game suspension, back week 7
