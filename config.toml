# ZOO + PEARL — Sleeper fantasy lineup advisor
[league]
league_id = "1389691132912361472"
roster_id = 5                                    # ThaneosTV / "Patrick Likes It Rough"
season = 2026
# 2025 season, status=complete — used as the backtest / prior-fitting corpus
previous_league_id = "1257120142102372352"

[paths]
db = "data/fantasylineup.db"
cache = "data/cache"
reports = "reports"
site = "docs"

[sources]
sleeper_base = "https://api.sleeper.app"
kalshi_base = "https://api.elections.kalshi.com/trade-api/v2"
# Sleeper asks for <1000 calls/min; we stay far below and cache aggressively.
max_calls_per_min = 120
# The 14.6MB player dump only needs refreshing daily.
players_dump_ttl_hours = 24
# Injury status can change hourly on game days.
status_ttl_minutes = 30

[model]
# Kalshi shifts the Sleeper baseline within this band; it never replaces it.
kalshi_max_shift = 0.25
# Monte Carlo draws for win-probability evaluation.
sim_draws = 20000

[health]
# Rest-of-season multipliers by injury regime. Weekly projections need no
# haircut -- Sleeper already omits players who are not playing.
#
# These are literature-informed judgment, not fitted values. Achilles ruptures
# return at a mean of 10.9 months and ACL reconstructions at 13.6, both beyond
# any remaining schedule, which is why out_long is zero rather than discounted.
# playing_diminished_structural is the weakest number here: decline in the first
# season back is documented, but Sleeper may already price some of it, so it is
# deliberately small. It is the first thing `fl calibrate` should measure.
healthy = 1.00
playing_diminished_structural = 0.90
playing_diminished_soft = 1.00
out_short = 0.40
out_long = 0.00
