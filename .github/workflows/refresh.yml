name: Refresh advisory

# Every fifteen minutes, with the decision about how much work to do made inside
# `fl refresh` rather than encoded as separate cron entries. Neither Sleeper nor
# Kalshi needs authentication, so there are no secrets and nothing to rotate.
#
# The interval is deliberately shorter than the refresh rate we actually want.
# GitHub drops scheduled runs under load rather than queuing them: an hourly
# cron measured over its first two days fired eleven times in forty-three hours,
# a run every 4.3 hours on average and once as little as six times a day. Asking
# four times as often does not make GitHub punctual, but it makes a missed slot
# cost minutes instead of hours -- which matters when a player is cleared the
# day before kickoff.
#
# Two further caveats worth knowing. GitHub disables scheduled workflows after
# 60 days of repository inactivity -- the commit this job makes keeps it alive.
# And cron here can be delayed regardless, so nothing downstream treats a run
# time as a deadline: every deadline is computed from the schedule data itself.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      with_moves:
        description: "Force the waiver and trade search"
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # The database is cache, not source of truth: everything in it can be
      # rebuilt from the APIs. Restoring it just avoids re-downloading the
      # 14MB player dump every hour.
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: fantasylineup-data-${{ github.run_id }}
          restore-keys: fantasylineup-data-

      - name: Refresh
        run: |
          fl refresh ${{ inputs.with_moves && '--with-moves' || '' }}

      # Tuesday morning: recap the completed week, then refit the model on it.
      # Lands before the league's Tuesday waiver run, so it doubles as claim prep.
      - name: Tuesday recap and calibration
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(date -u +%u)" = "2" ] && [ "$(date -u +%H)" = "13" ]; then
            fl recap
            fl calibrate
          fi

      - name: Save data cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: fantasylineup-data-${{ github.run_id }}

      # Commit only when the page actually changed. Every run rewrites the
      # "Updated ..." timestamp, so committing unconditionally would produce
      # a commit an hour forever and bury real changes in noise.
      - name: Publish if changed
        run: |
          git config user.name "fantasylineup-bot"
          git config user.email "noreply@github.com"
          if git diff --quiet -- docs/; then
            echo "No change to the dashboard; nothing to commit."
            exit 0
          fi
          # Ignore a diff that is only the timestamp line.
          changed=$(git diff -U0 -- docs/ | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
            | grep -vc 'class="sub"' || true)
          if [ "$changed" -eq 0 ]; then
            echo "Only the timestamp moved; skipping commit."
            git checkout -- docs/
            exit 0
          fi
          git add docs/
          git commit -m "Refresh advisory dashboard"
          git push
