[project]
name = "fantasylineup"
version = "0.1.0"
description = "Lock-aware Sleeper fantasy football lineup, waiver and trade advisor"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
fl = "fantasylineup.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["fantasylineup"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
